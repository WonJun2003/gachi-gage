<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>같이가게 · 우리 가게를 이해하는 마케팅 AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏪</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-robot" src="/img/robot-hello.png" alt="" />같이가게<small>우리 가게를 이해하는 마케팅 AI</small></div>
    <div class="top-right">
      <div id="providerBadge" class="badge"></div>
      <div id="userBox" class="user-box hidden"><span id="userName"></span><button id="logoutBtn" type="button">로그아웃</button></div>
    </div>
  </header>

  <div class="frame">
    <main id="app"></main>
    <nav id="nav" class="nav hidden">
      <button data-view="home" class="active"><svg viewBox="0 0 24 24"><path d="M3.5 11.2L12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-6h-6v6H4.5a1 1 0 0 1-1-1z" fill="currentColor"/></svg>홈</button>
      <button data-view="posts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h8l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4M8.5 12h7M8.5 16h7"/></svg>기록</button>
      <button data-view="store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z"/><path d="M4 7.4l8 4.6 8-4.6M12 12v9.2"/></svg>가게</button>
    </nav>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/imaging.js"></script>
  <script src="/app.js"></script>
  <script src="/wire.js"></script>
</body>
</html>
